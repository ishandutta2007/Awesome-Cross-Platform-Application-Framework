<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.05)}}@keyframes floatParticle{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-15px) rotate(180deg)}}@keyframes dashMove{0%{stroke-dashoffset:0}}.bg-circle,.particle{animation:pulseGlow 6s infinite ease-in-out;transform-origin:center}.particle{animation:floatParticle 8s infinite ease-in-out}.tech-line{stroke-dasharray:10,10;animation:dashMove 4s linear infinite}</style><rect width="1200" height="300" fill="url(#bgGrad)" rx="16"/><circle cx="150" cy="80" r="120" fill="#38bdf8" class="bg-circle" opacity=".15"/><circle cx="1050" cy="220" r="140" fill="#c084fc" class="bg-circle" opacity=".15" style="animation-delay:-3s"/><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 100 250 L 300 250 L 400 200 L 800 200 L 900 250 L 1100 250" class="tech-line" opacity=".3"/><path fill="none" stroke="#818cf8" stroke-width="2" d="M 50 50 L 250 50 L 350 100 L 850 100 L 950 50 L 1150 50" class="tech-line" opacity=".3" style="animation-delay:-2s"/><rect width="30" height="30" x="180" y="180" fill="#818cf8" class="particle" opacity=".25" rx="6"/><rect width="40" height="40" x="980" y="60" fill="#38bdf8" class="particle" opacity=".2" rx="8" style="animation-delay:-4s"/><polygon fill="#c084fc" poin