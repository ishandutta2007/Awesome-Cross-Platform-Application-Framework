<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(180deg); }
      100% { transform: translateY(0px) rotate(360deg); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -40; }
    }
    .bg-circle { animation: pulseGlow 6s infinite ease-in-out; transform-origin: center; }
    .particle { animation: floatParticle 8s infinite ease-in-out; transform-origin: center; }
    .tech-line { stroke-dasharray: 10, 10; animation: dashMove 4s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic Animated Background Elements (Behind Text) -->
  <circle cx="150" cy="80" r="120" fill="#38bdf8" opacity="0.15" class="bg-circle" />
  <circle cx="1050" cy="220" r="140" fill="#c084fc" opacity="0.15" class="bg-circle" style="animation-delay: -3s;" />

  <!-- Animated Tech Connection Lines -->
  <path d="M 100 250 L 300 250 L 400 200 L 800 200 L 900 250 L 1100 250" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3" class="tech-line" />
  <path d="M 50 50 L 250 50 L 350 100 L 850 100 L 950 50 L 1150 50" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.3" class="tech-line" style="animation-delay: -2s;" />

  <!-- Floating Geometric Shapes (Background) -->
  <rect x="180" y="180" width="30" height="30" rx="6" fill="#818cf8" opacity="0.25" class="particle" />
  <rect x="980" y="60" width="40" height="40" rx="8" fill="#38bdf8" opacity="0.2" class="particle" style="animation-delay: -4s;" />
  <polygon points="900,220 920,250 880,250" fill="#c084fc" opacity="0.2" class="particle" style="animation-delay: -2s;" />

  <!-- Foreground Title and Subtitle (Guaranteed Clear & Visible) -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="600" y="130" fill="url(#textGrad)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="1.5" filter="url(#glow)">
      Awesome Cross-Platform Application Framework
    </text>
    <text x="600" y="130" fill="url(#textGrad)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="1.5">
      Awesome Cross-Platform Application Framework
    </text>

    <!-- Subtitle -->
    <text x="600" y="185" fill="#94a3b8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" letter-spacing="0.8">
      ⚡ Curated List of Top Mobile, Desktop, Web &amp; Embedded Development Frameworks ⚡
    </text>

    <!-- Platform Badges in SVG -->
    <g transform="translate(370, 220)">
      <rect x="0" y="0" width="90" height="28" rx="14" fill="#38bdf8" opacity="0.2" stroke="#38bdf8" stroke-width="1" />
      <text x="45" y="19" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="600">📱 Mobile</text>

      <rect x="110" y="0" width="100" height="28" rx="14" fill="#818cf8" opacity="0.2" stroke="#818cf8" stroke-width="1" />
      <text x="160" y="19" fill="#818cf8" font-family="sans-serif" font-size="13" font-weight="600">💻 Desktop</text>

      <rect x="230" y="0" width="85" height="28" rx="14" fill="#c084fc" opacity="0.2" stroke="#c084fc" stroke-width="1" />
      <text x="272" y="19" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="600">🌐 Web</text>

      <rect x="330" y="0" width="130" height="28" rx="14" fill="#f43f5e" opacity="0.2" stroke="#f43f5e" stroke-width="1" />
      <text x="395" y="19" fill="#f43f5e" font-family="sans-serif" font-size="13" font-weight="600">🔌 Embedded</text>
    </g>
  </g>
</svg>
